name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TG_EXPORTER_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Build Linux bundle
        run: chmod +x ./scripts/build_linux.sh && ./scripts/build_linux.sh
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tg-exporter-linux-x86_64.tar.gz

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TG_EXPORTER_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Build macOS bundle
        env:
          TARGET_ARCH: arm64
        run: chmod +x ./scripts/build_mac.sh && ./scripts/build_mac.sh
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tg-exporter-mac-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TG_EXPORTER_VERSION=${{ github.ref_name }}" | ForEach-Object { $v = $_ -replace '^v',''; "TG_EXPORTER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      - name: Build Windows bundle
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_win.ps1
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tg-exporter-windows-x86_64.zip
