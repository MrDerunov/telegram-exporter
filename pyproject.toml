[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-exporter"
version = "1.0.0"
description = "Консольная утилита для экспорта чатов Telegram в JSON и Markdown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Sergey Derunov", email = "mr.derunov@gmail.com" },
]
keywords = ["telegram", "export", "chat", "cli", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.36,<2.0",
    "click>=8.1,<9.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "keyring>=24.0,<26.0",
    "imageio-ffmpeg>=0.4.9,<1.0",
    "faster-whisper>=1.0,<2.0",
]

[project.optional-dependencies]
# Транскрипция через Deepgram — не требует дополнительных пакетов (stdlib urllib).
# Оставлен пустым для явности.
deepgram = []
# Зависимости для разработки и тестирования.
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
tg-exporter = "tg_exporter_cli.main:cli"

[project.urls]
Homepage = "https://github.com/MrDerunov/telegram-exporter"
Repository = "https://github.com/MrDerunov/telegram-exporter.git"
Issues = "https://github.com/MrDerunov/telegram-exporter/issues"

[tool.setuptools.packages.find]
include = ["tg_exporter", "tg_exporter_cli"]

[tool.setuptools.package-data]
tg_exporter = ["*.md"]
tg_exporter_cli = []

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "I001",  # несортированные импорты — ok
    "F401",  # неиспользуемые импорты — ok
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
